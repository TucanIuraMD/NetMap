{% set is_edit = ip_address is not none and ip_address.get('id') is not none %}

<div class="modal-header">
  <h5 class="modal-title">{{ 'Edit IP Address' if is_edit else 'Add IP Address' }}</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<form hx-{{ 'put' if is_edit else 'post' }}="{{ url_for('web.devices.update_ip_address', device_id=device.id, ip_address_id=ip_address.id) if is_edit else url_for('web.devices.create_ip_address', device_id=device.id) }}"
      hx-target="#nm-modal-content"
      hx-swap="innerHTML">
  <div class="modal-body">
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label">Interface *</label>
      <select name="interface_id" class="form-select" required>
        <option value="">Select interface…</option>
        {% for iface in interfaces %}
        <option value="{{ iface.id }}" {{ 'selected' if ip_address and ip_address.interface_id == iface.id }}>
          {{ iface.name }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="row">
      <div class="col-md-8 mb-3">
        <label class="form-label">Address *</label>
        <input type="text" name="address" class="form-control nm-mono" required
               value="{{ ip_address.address if ip_address else '' }}"
               placeholder="192.168.1.10 or 2001:db8::1">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Version *</label>
        <select name="version" class="form-select" required>
          <option value="">—</option>
          <option value="4" {{ 'selected' if ip_address and ip_address.version == 4 }}>IPv4</option>
          <option value="6" {{ 'selected' if ip_address and ip_address.version == 6 }}>IPv6</option>
        </select>
      </div>
    </div>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" role="switch" name="is_primary" id="ip-is-primary"
             {{ 'checked' if ip_address and ip_address.is_primary }}>
      <label class="form-check-label" for="ip-is-primary">Primary</label>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="2">{{ ip_address.description if ip_address and ip_address.description else '' }}</textarea>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">
      <span class="htmx-indicator spinner-border spinner-border-sm me-1"></span>
      Save
    </button>
  </div>
</form>

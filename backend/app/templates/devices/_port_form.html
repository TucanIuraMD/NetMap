{% set is_edit = port is not none and port.get('id') is not none %}

<div class="modal-header">
  <h5 class="modal-title">{{ 'Edit Port' if is_edit else 'Add Port' }}</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<form hx-{{ 'put' if is_edit else 'post' }}="{{ url_for('web.devices.update_port', device_id=device.id, port_id=port.id) if is_edit else url_for('web.devices.create_port', device_id=device.id) }}"
      hx-target="#nm-modal-content"
      hx-swap="innerHTML">
  <div class="modal-body">
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Port Number *</label>
        <input type="number" name="port_number" min="1" max="65535" class="form-control" required
               value="{{ port.port_number if port else '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Protocol *</label>
        <select name="protocol" class="form-select" required>
          <option value="">—</option>
          <option value="tcp" {{ 'selected' if port and port.protocol == 'tcp' }}>tcp</option>
          <option value="udp" {{ 'selected' if port and port.protocol == 'udp' }}>udp</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          {% for s in port_statuses %}
          <option value="{{ s }}" {{ 'selected' if port and port.status == s }}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Web Scheme</label>
        <select name="web_scheme" class="form-select">
          <option value="">—</option>
          {% for scheme in web_schemes %}
          <option value="{{ scheme }}" {{ 'selected' if port and port.web_scheme == scheme }}>{{ scheme }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Display Name</label>
      <input type="text" name="display_name" class="form-control"
             value="{{ port.display_name if port and port.display_name else '' }}">
      <div class="form-text">Не изменяется автоматически при Discovery.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="2">{{ port.description if port and port.description else '' }}</textarea>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">
      <span class="htmx-indicator spinner-border spinner-border-sm me-1"></span>
      Save
    </button>
  </div>
</form>

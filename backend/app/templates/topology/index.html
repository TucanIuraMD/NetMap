{% extends "base.html" %}
{% block title %}Topology — NetMap{% endblock %}
{% block page_title %}Topology{% endblock %}

{% block topbar_actions %}
<div class="btn-group btn-group-sm">
  <button type="button" class="btn btn-outline-secondary" id="topology-toggle-unlinked">
    <i class="bi bi-diagram-2"></i> Show without links
  </button>
  <button type="button" class="btn btn-outline-secondary" id="topology-fit">
    <i class="bi bi-arrows-fullscreen"></i> Fit
  </button>
  <button type="button" class="btn btn-outline-secondary" id="topology-reload">
    <i class="bi bi-arrow-clockwise"></i> Reload
  </button>
</div>
{% endblock %}

{% block content %}
<form class="row g-2 mb-3 align-items-center" id="topology-filter-form">
  <div class="col-auto">
    <select name="network_id" id="topology-network" class="form-select form-select-sm nm-filter">
      <option value="">All networks</option>
      {% for network in networks %}
      <option value="{{ network.id }}">{{ network.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <select name="device_type" id="topology-type" class="form-select form-select-sm nm-filter">
      <option value="">All types</option>
      {% for t in device_types %}
      <option value="{{ t }}">{{ t }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <select name="status" id="topology-status" class="form-select form-select-sm nm-filter">
      <option value="">All statuses</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>
  <div class="col-auto">
    <button type="button" class="btn btn-sm btn-outline-secondary" id="topology-reset">Reset</button>
  </div>
</form>

<div id="topology-status" class="text-body-secondary small mb-2">Loading topology…</div>
<div id="topology-canvas" style="width: 100%; height: 70vh; border: 1px solid var(--bs-border-color); border-radius: 8px;"></div>

<div class="card mt-3 d-none" id="topology-node-panel">
  <div class="card-body">
    <h6 id="topology-node-title" class="mb-1"></h6>
    <div id="topology-node-meta" class="text-body-secondary small mb-2"></div>
    <a href="#" id="topology-node-link" class="btn btn-sm btn-outline-primary">Open Details</a>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='vendor/cytoscape/cytoscape.min.js') }}"></script>
<script>
  window.NM_TOPOLOGY_URL = "{{ url_for('api_v1.topology.get_topology') }}";
  window.NM_DEVICE_DETAILS_BASE = "{{ url_for('web.devices.list_devices') }}";
</script>
<script src="{{ url_for('static', filename='js/topology.js') }}"></script>
{% endblock %}

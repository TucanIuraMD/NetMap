{% extends "base.html" %}
{% block title %}Topology — NetMap{% endblock %}
{% block page_title %}Topology{% endblock %}

{% block topbar_actions %}
<div class="btn-group btn-group-sm">
  <button type="button" class="btn btn-outline-secondary" id="topology-fit">
    <i class="bi bi-arrows-fullscreen"></i> Fit
  </button>
  <button type="button" class="btn btn-outline-secondary" id="topology-reload">
    <i class="bi bi-arrow-clockwise"></i> Reload
  </button>
</div>
{% endblock %}

{% block content %}
<div id="topology-status" class="text-body-secondary small mb-2">Loading topology…</div>
<div id="topology-canvas" style="width: 100%; height: 70vh; border: 1px solid var(--bs-border-color); border-radius: 8px;"></div>

<div class="card mt-3 d-none" id="topology-node-panel">
  <div class="card-body">
    <h6 id="topology-node-title" class="mb-1"></h6>
    <div id="topology-node-meta" class="text-body-secondary small mb-2"></div>
    <a href="#" id="topology-node-link" class="btn btn-sm btn-outline-primary">Open Details</a>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='vendor/cytoscape/cytoscape.min.js') }}"></script>
<script>
  window.NM_DEVICES_URL = "{{ url_for('api_v1.devices.list_devices') }}";
  window.NM_CONNECTIONS_URL = "{{ url_for('api_v1.connections.list_connections') }}";
  window.NM_INTERFACES_URL = "{{ url_for('api_v1.interfaces.list_interfaces') }}";
  window.NM_DEVICE_DETAILS_BASE = "{{ url_for('web.devices.list_devices') }}";
</script>
<script src="{{ url_for('static', filename='js/topology.js') }}"></script>
{% endblock %}
